name: Check public Citadel startup
on:
  push:
    branches: [release/citadel-1.9.3]
    paths: [.github/workflows/check-startup193.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public configuration only (no player data or writes)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          url='https://cmpon-metrics-service.carlafloriano1958.chatgpt.site/api/tournament/config'
          request=urllib.request.Request(url,headers={'Origin':'https://andrejk-blip.github.io','User-Agent':'Citadel-QA-public-config/1.9.3'})
          try:
              with urllib.request.urlopen(request,timeout=20) as r:
                  body=r.read(65536).decode('utf-8','replace')
                  print(json.dumps({'status':r.status,'contentType':r.headers.get('Content-Type'),'allowOrigin':r.headers.get('Access-Control-Allow-Origin'),'finalURL':r.url,'body':body},ensure_ascii=False))
          except Exception as e:
              print(json.dumps({'error':str(e)},ensure_ascii=False))
          PY
